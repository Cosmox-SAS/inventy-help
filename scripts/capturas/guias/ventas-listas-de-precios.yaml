guia: ventas/listas-de-precios.md
# Activa las listas de precios, crea "Mayorista", le da precio al café (unidad y
# CAJA X 12) y se la asigna a LAURA GÓMEZ. El POS (último paso) no guarda.
orden: 21
pasos:
  - paso: 1
    acciones:
      - ir: /{tenant}/module-settings?module=sales
      - esperar: '[data-testid="settings-toggle-price_lists_enabled"]'
    guarda_datos: true
    resaltar: '[data-testid="settings-toggle-price_lists_enabled"] >> xpath=ancestor::div[2]'
    despues:
      - clic: '[data-testid="settings-toggle-price_lists_enabled"]'
      - pausa: 2500
  - paso: 2
    acciones:
      - ir: /{tenant}/price-lists
      - esperar: 'main'
    resaltar: 'main button:has-text("Nueva lista"), main a:has-text("Nueva lista") >> nth=0'
  - paso: 3
    acciones:
      - abrir: 'main button:has-text("Nueva lista"), main a:has-text("Nueva lista") >> nth=0'
      - esperar: 'VENTANA'
      - llenar: { 'VENTANA >> #name': 'Mayorista' }
    guarda_datos: true
    resaltar: 'VENTANA'
    recortar: 'VENTANA'
    despues:
      - clic: 'VENTANA >> button:text-is("Crear")'
      - pausa: 2500
  - paso: 4
    acciones:
      - ir: /{tenant}/products
      - abrir: 'tbody tr:has-text("CAFÉ MOLIDO") >> nth=0'
      - esperar: 'main a:has-text("Editar producto")'
      - abrir: 'main a:has-text("Editar producto")'
      - esperar: 'main button:text-is("Precios")'
      - abrir: 'main button:text-is("Precios")'
      - esperar: 'button:has-text("Añadir precio")'
      - abrir: 'button:has-text("Añadir precio")'
      - elegir: { 'main tbody tr >> nth=0 >> button:has-text("Seleccionar lista")': 'Mayorista' }
      - elegir: { 'main tbody tr >> nth=0 >> button:has-text("Seleccionar sede")': 'Principal' }
      - llenar: { 'main tbody tr >> nth=0 >> input >> nth=-1': '16000' }
      - abrir: 'button:has-text("Añadir precio")'
      - elegir: { 'main tbody tr >> nth=1 >> button:has-text("Seleccionar lista")': 'Mayorista' }
      - elegir: { 'main tbody tr >> nth=1 >> button:has-text("Ítem base")': 'CAJA X 12' }
      - elegir: { 'main tbody tr >> nth=1 >> button:has-text("Seleccionar sede")': 'Principal' }
      - llenar: { 'main tbody tr >> nth=1 >> input >> nth=-1': '190000' }
      - pausa: 800
    guarda_datos: true
    resaltar: 'main table'
    despues:
      - clic: 'button:has-text("Guardar precios")'
      - esperar: 'text=Precios actualizados exitosamente.'
  - paso: 5
    acciones:
      - ir: /{tenant}/customers
      - abrir: 'tbody tr:has-text("LAURA") >> nth=0'
      - esperar: 'main a:has-text("Editar")'
      - abrir: 'main a:has-text("Editar")'
      - esperar: 'button:has-text("Actualizar cliente")'
      - elegir: { 'button:has-text("Buscar lista de precios...")': 'Mayorista' }
      - pausa: 600
    guarda_datos: true
    resaltar: 'section:has(:is(h2,h3):has-text("Datos del rol de cliente"))'
    despues:
      - clic: 'button:has-text("Actualizar cliente")'
      - pausa: 3000
  - paso: 6
    acciones:
      - ir: /{tenant}/pos
      - esperar: '[data-testid="pos-catalog"]'
      - abrir: 'text=Consumidor Final'
      - esperar: 'VENTANA'
      - abrir: 'VENTANA >> button:has-text("LAURA GÓMEZ") >> nth=0'
      - pausa: 1000
      - escribir: { 'input[placeholder^="Buscar producto"]': 'café' }
      - pausa: 1500
      - abrir: '[data-testid="pos-catalog"] >> text=CAFÉ MOLIDO 500 G >> nth=0'
      - pausa: 1000
    resaltar: '[data-testid="pos-cart"]'
