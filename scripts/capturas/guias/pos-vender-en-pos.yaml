guia: pos/vender-en-pos.md
# Requiere la caja abierta (pos/abrir-caja, orden 31) y el café con existencias
# (productos-inventario/ajuste-inventario, orden 16). Registra UNA venta real.
orden: 32
pasos:
  - paso: 1
    acciones:
      - ir: /{tenant}/pos
      - esperar: '[data-testid="pos-catalog"]'
    resaltar: '[data-testid="pos-catalog"]'
  - paso: 2
    acciones:
      - escribir: { 'input[placeholder^="Buscar producto"]': 'café' }
      - pausa: 1200
    resaltar: 'input[placeholder^="Buscar producto"]'
  - paso: 3
    acciones:
      - abrir: '[data-testid="pos-catalog"] >> text=CAFÉ MOLIDO 500 G'
      - pausa: 800
    resaltar: '[data-testid="pos-cart"]'
  - paso: 4
    acciones:
      - abrir: '[data-testid="pos-cart"] >> text=CAFÉ MOLIDO 500 G'
      - pausa: 600
    resaltar: '[data-testid="pos-cart"] >> text=CAFÉ MOLIDO 500 G >> xpath=ancestor::*[self::li or self::div][2]'
    despues:
      - tecla: Escape
  - paso: 5
    resaltar: 'text=Consumidor Final >> xpath=ancestor::*[self::button or self::div][2]'
  - paso: 6
    resaltar: 'aside [data-testid="pos-submit-order"]'
  - paso: 7
    acciones:
      - abrir: 'aside [data-testid="pos-submit-order"]'
      - esperar: '[data-testid="pos-modal-payment"]'
      - abrir: '[data-testid="pos-numpad-key-exact"]'
    resaltar: '[data-testid="pos-numpad"]'
    recortar: 'VENTANA'
  - paso: 8
    guarda_datos: true
    resaltar: 'VENTANA >> button:has-text("Confirmar cobro")'
    recortar: 'VENTANA'
    despues:
      - clic: 'VENTANA >> button:has-text("Confirmar cobro")'
      - esperar: 'text=Venta registrada con éxito'
