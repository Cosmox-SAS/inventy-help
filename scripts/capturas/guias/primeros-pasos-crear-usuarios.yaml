guia: primeros-pasos/crear-usuarios.md
pasos:
  - paso: 1
    acciones:
      - menu: Usuarios
      - esperar: 'text=Nuevo usuario'
    resaltar: 'a:has-text("Invitaciones")'
  - paso: 2
    acciones:
      - abrir: 'a:has-text("Invitaciones")'
      - esperar: 'text=Invitar usuario'
    resaltar: 'button:has-text("Invitar usuario")'
  - paso: 3
    acciones:
      - abrir: 'button:has-text("Invitar usuario")'
      - esperar: 'VENTANA'
      - llenar: { 'VENTANA >> input >> nth=0': 'María Gómez', 'VENTANA >> input[type="email"]': 'maria@empresa.com' }
    resaltar: 'VENTANA'
    recortar: 'VENTANA'
  - paso: 4
    resaltar: 'VENTANA >> button:has-text("Enviar invitación")'
    recortar: 'VENTANA'
  - paso: 5
    manual: pantalla Aceptar invitación (se abre desde el correo de invitación)
