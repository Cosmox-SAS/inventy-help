guia: productos-inventario/variantes.md
# Crea en la demo: atributos Talla (S, M, L) y Color (Negro, Rojo) y el producto
# con variantes "CASCO SHAFT 526". Se corre UNA vez, guía por guía:
#   CAPTURAS_PERMITIR_GUARDAR=1 npm run capturas -- productos-inventario/variantes
pasos:
  - paso: 1
    acciones:
      - ir: /{tenant}/item-attributes
      - esperar: 'text=Atributos de producto'
    resaltar: 'main button:has-text("Nuevo atributo")'
  - paso: 2
    guarda_datos: true
    acciones:
      - abrir: 'main button:has-text("Nuevo atributo")'
      - esperar: '#attribute_name'
      - llenar: { '#attribute_name': 'Talla' }
    resaltar: 'VENTANA >> #attribute_name >> xpath=..'
    recortar: 'VENTANA'
    despues:
      - clic: 'VENTANA >> button[type="submit"]'
      - esperar: 'tbody >> text=Talla'
  - paso: 3
    guarda_datos: true
    acciones:
      - ir: /{tenant}/item-attributes
      - esperar: 'tbody >> text=Talla'
      - abrir: 'tbody tr:has-text("Talla") >> button:has-text("Agregar valor")'
      - esperar: 'VENTANA'
      - llenar: { 'VENTANA >> input >> nth=0': 'S' }
    resaltar: 'VENTANA >> input >> nth=0 >> xpath=..'
    recortar: 'VENTANA'
    despues:
      - clic: 'VENTANA >> button[type="submit"]'
      - pausa: 1500
      # Resto del ejemplo (sin foto): M, L y el atributo Color con Negro y Rojo.
      - abrir: 'tbody tr:has-text("Talla") >> button:has-text("Agregar valor")'
      - llenar: { 'VENTANA >> input >> nth=0': 'M' }
      - clic: 'VENTANA >> button[type="submit"]'
      - pausa: 1500
      - abrir: 'tbody tr:has-text("Talla") >> button:has-text("Agregar valor")'
      - llenar: { 'VENTANA >> input >> nth=0': 'L' }
      - clic: 'VENTANA >> button[type="submit"]'
      - pausa: 1500
      - abrir: 'main button:has-text("Nuevo atributo")'
      - llenar: { '#attribute_name': 'Color' }
      - clic: 'VENTANA >> button[type="submit"]'
      - esperar: 'tbody >> text=Color'
      - abrir: 'tbody tr:has-text("Color") >> button:has-text("Agregar valor")'
      - llenar: { 'VENTANA >> input >> nth=0': 'Negro' }
      - clic: 'VENTANA >> button[type="submit"]'
      - pausa: 1500
      - abrir: 'tbody tr:has-text("Color") >> button:has-text("Agregar valor")'
      - llenar: { 'VENTANA >> input >> nth=0': 'Rojo' }
      - clic: 'VENTANA >> button[type="submit"]'
      - pausa: 1500
  - paso: 4
    acciones:
      - pausa: 500
    resaltar: 'tbody'
  - paso: 5
    acciones:
      - ir: /{tenant}/products/create
      - esperar: 'button:has-text("Crear con variantes")'
    resaltar: 'button:has-text("Crear con variantes")'
  - paso: 6
    acciones:
      - abrir: 'button:has-text("Crear con variantes")'
      - esperar: 'text=Crear producto con variantes'
      - llenar: { '#matrix_name': 'CASCO SHAFT 526' }
      - elegir: { 'text=Buscar unidad...': 'Unidad' }
      - elegir: { 'text=Buscar catálogo...': 'IVA 19%' }
    resaltar: 'section:has(h2:text-is("Producto padre"))'
  - paso: 7
    acciones:
      - abrir: 'text=Seleccionar valores de Color...'
      - abrir: 'role=option >> text=Negro'
      - abrir: 'role=option >> text=Rojo'
      - tecla: Escape
      - abrir: 'text=Seleccionar valores de Talla...'
      - abrir: 'role=option >> text="S"'
      - abrir: 'role=option >> text="M"'
      - abrir: 'role=option >> text="L"'
      - tecla: Escape
      - pausa: 800
    resaltar: 'section:has(h2:text-is("Atributos"))'
  - paso: 8
    acciones:
      - llenar: { 'section:has-text("Combinaciones") >> tbody tr >> nth=0 >> input[placeholder="0"] >> nth=0': '189000', 'section:has-text("Combinaciones") >> tbody tr >> nth=0 >> input[placeholder="0"] >> nth=1': '125000' }
      - llenar: { 'section:has-text("Combinaciones") >> tbody tr >> nth=1 >> input[placeholder="0"] >> nth=0': '189000', 'section:has-text("Combinaciones") >> tbody tr >> nth=1 >> input[placeholder="0"] >> nth=1': '125000' }
      - llenar: { 'section:has-text("Combinaciones") >> tbody tr >> nth=2 >> input[placeholder="0"] >> nth=0': '189000', 'section:has-text("Combinaciones") >> tbody tr >> nth=2 >> input[placeholder="0"] >> nth=1': '125000' }
      - llenar: { 'section:has-text("Combinaciones") >> tbody tr >> nth=3 >> input[placeholder="0"] >> nth=0': '189000', 'section:has-text("Combinaciones") >> tbody tr >> nth=3 >> input[placeholder="0"] >> nth=1': '125000' }
      - llenar: { 'section:has-text("Combinaciones") >> tbody tr >> nth=4 >> input[placeholder="0"] >> nth=0': '189000', 'section:has-text("Combinaciones") >> tbody tr >> nth=4 >> input[placeholder="0"] >> nth=1': '125000' }
      - llenar: { 'section:has-text("Combinaciones") >> tbody tr >> nth=5 >> input[placeholder="0"] >> nth=0': '189000', 'section:has-text("Combinaciones") >> tbody tr >> nth=5 >> input[placeholder="0"] >> nth=1': '125000' }
      - pausa: 500
    resaltar: 'section:has-text("Combinaciones")'
  - paso: 9
    guarda_datos: true
    resaltar: 'button:has-text("Generar variantes")'
    despues:
      - clic: 'button:has-text("Generar variantes")'
      - pausa: 4000
  - paso: 10
    acciones:
      - ir: /{tenant}/products
      - escribir: { 'main input[placeholder^="Buscar"]': 'CASCO' }
      - pausa: 1500
      - abrir: 'tbody >> text="CASCO SHAFT 526" >> nth=0'
      - esperar: 'text=Este producto es una familia de variantes'
    resaltar: 'section:has(h2:text-is("Variantes"))'
  - paso: 11
    acciones:
      - ir: /{tenant}/pos
      - esperar: '[data-testid="pos-catalog"]'
      - pausa: 1500
    resaltar: '[data-testid="pos-catalog"] >> text="CASCO SHAFT 526" >> xpath=ancestor::*[self::button or @role="button" or self::article][1]'
  - paso: 12
    acciones:
      - abrir: '[data-testid="pos-catalog"] >> text="CASCO SHAFT 526"'
      - esperar: 'VENTANA'
      - pausa: 800
    resaltar: 'VENTANA'
    recortar: 'VENTANA'
  # ── Ejemplo 2: llanta por medida (un solo atributo, precio distinto por medida) ──
  #   CAPTURAS_PERMITIR_GUARDAR=1 npm run capturas -- productos-inventario/variantes --pasos 13-16
  - paso: 13
    guarda_datos: true
    acciones:
      - ir: /{tenant}/item-attributes
      - esperar: 'text=Atributos de producto'
      - abrir: 'main button:has-text("Nuevo atributo")'
      - llenar: { '#attribute_name': 'Medida' }
      - clic: 'VENTANA >> button[type="submit"]'
      - esperar: 'tbody >> text=Medida'
      - abrir: 'tbody tr:has-text("Medida") >> button:has-text("Agregar valor")'
      - llenar: { 'VENTANA >> input >> nth=0': '80/100-17' }
      - clic: 'VENTANA >> button[type="submit"]'
      - pausa: 1500
      - abrir: 'tbody tr:has-text("Medida") >> button:has-text("Agregar valor")'
      - llenar: { 'VENTANA >> input >> nth=0': '90/90-18' }
      - clic: 'VENTANA >> button[type="submit"]'
      - pausa: 1500
      - abrir: 'tbody tr:has-text("Medida") >> button:has-text("Agregar valor")'
      - llenar: { 'VENTANA >> input >> nth=0': '100/90-18' }
      - clic: 'VENTANA >> button[type="submit"]'
      - pausa: 2500
    resaltar: 'tbody tr:has-text("Medida")'
  - paso: 14
    acciones:
      - ir: /{tenant}/products/create
      - abrir: 'button:has-text("Crear con variantes")'
      - esperar: 'text=Crear producto con variantes'
      - llenar: { '#matrix_name': 'LLANTA MICHELIN PILOT STREET' }
      - elegir: { 'text=Buscar unidad...': 'Unidad' }
      - elegir: { 'text=Buscar catálogo...': 'IVA 19%' }
      - abrir: 'text=Seleccionar valores de Medida...'
      - abrir: 'role=option >> text="80/100-17"'
      - abrir: 'role=option >> text="90/90-18"'
      - abrir: 'role=option >> text="100/90-18"'
      - tecla: Escape
      - pausa: 800
      - llenar: { 'section:has-text("Combinaciones") >> tbody tr >> nth=0 >> input[placeholder="0"] >> nth=0': '245000', 'section:has-text("Combinaciones") >> tbody tr >> nth=0 >> input[placeholder="0"] >> nth=1': '170000' }
      - llenar: { 'section:has-text("Combinaciones") >> tbody tr >> nth=1 >> input[placeholder="0"] >> nth=0': '289000', 'section:has-text("Combinaciones") >> tbody tr >> nth=1 >> input[placeholder="0"] >> nth=1': '200000' }
      - llenar: { 'section:has-text("Combinaciones") >> tbody tr >> nth=2 >> input[placeholder="0"] >> nth=0': '329000', 'section:has-text("Combinaciones") >> tbody tr >> nth=2 >> input[placeholder="0"] >> nth=1': '230000' }
      - pausa: 500
    resaltar: 'section:has-text("Combinaciones")'
  - paso: 15
    guarda_datos: true
    resaltar: 'button:has-text("Generar variantes")'
    despues:
      - clic: 'button:has-text("Generar variantes")'
      - esperar: 'text=Este producto es una familia de variantes'
      - pausa: 1500
  - paso: 16
    acciones:
      - pausa: 300
    resaltar: 'section:has(h2:text-is("Variantes"))'
  - paso: 17
    acciones:
      - ir: /{tenant}/pos
      - esperar: '[data-testid="pos-catalog"]'
      - pausa: 1500
    resaltar: '[data-testid="pos-catalog"] >> text="LLANTA MICHELIN PILOT STREET" >> xpath=ancestor::*[self::button or @role="button" or self::article][1]'
