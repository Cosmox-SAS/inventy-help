guia: productos-inventario/crear-producto.md
orden: 15
pasos:
  - paso: 1
    acciones:
      - ir: /{tenant}/products
      - esperar: 'text=Nuevo Producto'
    resaltar: 'main >> a:has-text("Nuevo Producto"), main button:has-text("Nuevo Producto") >> nth=0'
  - paso: 2
    acciones:
      - ir: /{tenant}/products/create
      - esperar: 'text=Crear producto'
      - llenar: { '#name': 'Café molido 500 g', '#description': 'Café tostado y molido, bolsa de 500 g' }
    resaltar: 'section:has(h2:has-text("Identificación"))'
  - paso: 3
    acciones:
      - elegir: { 'text=Buscar unidad...': 'Unidad' }
    resaltar: 'text=Unidad de medida * >> xpath=..'
  - paso: 4
    acciones:
      - llenar: { '#sale_price': '18500', '#cost': '11000' }
      - elegir: { 'text=Buscar catálogo...': 'IVA 19%' }
    resaltar: 'section:has(h2:has-text("Precio e impuestos"))'
  - paso: 5
    acciones:
      - pausa: 300
    resaltar: 'section:has(h2:has-text("Comportamiento del producto"))'
    detener_si_falla: false
  - paso: 6
    guarda_datos: true
    resaltar: 'button:has-text("Crear Producto")'
    despues:
      - clic: 'button:has-text("Crear Producto")'
      - pausa: 2500
