guia: facturacion-electronica/emitir-factura-electronica.md
pasos:
  - paso: 1
    acciones:
      - ir: /{tenant}/sale-invoices
      - esperar: 'text=Facturas de Venta'
    resaltar: 'tbody tr:has-text("Validada") >> nth=0'
  - paso: 2
    acciones:
      - abrir: 'tbody tr:has-text("Validada") a >> nth=0'
      - esperar: 'text=Detalle de la factura de venta.'
    resaltar: 'button:has-text("Emitir electrónica")'
  - paso: 3
    acciones:
      - abrir: 'button:has-text("Emitir electrónica")'
      - esperar: 'text=¿Emitir factura electrónica?'
    resaltar: 'VENTANA'
    recortar: 'VENTANA'
  - paso: 4
    acciones:
      - ir: /{tenant}/electronic-documents
      - esperar: 'text=Documentos electrónicos'
    resaltar: 'table'
