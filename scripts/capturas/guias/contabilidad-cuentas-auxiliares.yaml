guia: contabilidad/cuentas-auxiliares.md
# Va antes que productos y ventas: asigna las cuentas a los catálogos de impuestos,
# cajas, etc. Sin esto, vender con Contabilidad activa da "asiento no balanceado".
orden: 8
pasos:
  - paso: 1
    acciones:
      - ir: /{tenant}/accounting/accounts?level=auxiliary
      - esperar: 'button:has-text("Cargar auxiliares por defecto")'
    resaltar: 'main'
  - paso: 2
    resaltar: 'button:has-text("Cargar auxiliares por defecto")'
  - paso: 3
    guarda_datos: true
    acciones:
      - abrir: 'button:has-text("Cargar auxiliares por defecto")'
      - esperar: 'VENTANA >> text=Cuentas a crear'
      - pausa: 800
    resaltar: 'VENTANA >> button:has-text("Confirmar")'
    recortar: 'VENTANA'
    despues:
      - clic: 'VENTANA >> button:has-text("Confirmar")'
      - esperar: 'button:has-text("Sí, aplicar")'
      - clic: 'button:has-text("Sí, aplicar")'
      - esperar: 'text=Auxiliares por defecto cargados exitosamente'
      - pausa: 1500
  - paso: 4
    acciones:
      - ir: /{tenant}/accounting/accounts?level=auxiliary
      - esperar: 'button:has-text("Nueva Cuenta Auxiliar")'
    resaltar: 'button:has-text("Nueva Cuenta Auxiliar")'
  - paso: 5
    acciones:
      - abrir: 'button:has-text("Nueva Cuenta Auxiliar")'
      - esperar: 'VENTANA >> text=Cuenta padre'
      - elegir: { 'VENTANA >> text=Buscar por código o nombre...': '110510' }
    resaltar: 'VENTANA >> text=Cuenta padre * >> xpath=ancestor::div[2]'
    recortar: 'VENTANA'
  - paso: 6
    acciones:
      - llenar: { 'VENTANA >> input[placeholder="Ej: CAJA MENOR SEDE NORTE"]': 'CAJA MENOR SEDE NORTE' }
    resaltar: 'VENTANA >> input[placeholder="Ej: CAJA MENOR SEDE NORTE"]'
    recortar: 'VENTANA'
  - paso: 7
    guarda_datos: true
    resaltar: 'VENTANA >> button:has-text("Crear cuenta")'
    recortar: 'VENTANA'
    despues:
      - clic: 'VENTANA >> button:has-text("Crear cuenta")'
      - esperar: 'text=Cuenta contable creada exitosamente'
