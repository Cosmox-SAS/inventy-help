site_name: Centro de Ayuda Inventy
site_description: Guías paso a paso para usar Inventy ERP en tu empresa.
site_author: Inventy
site_url: https://ayuda.inventy.com.co/
copyright: Inventy ERP · Centro de Ayuda

docs_dir: docs
strict: true
exclude_docs: |
  assets/capturas/pendientes.txt

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

theme:
  name: material
  language: es
  custom_dir: overrides
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Cambiar a modo oscuro
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Cambiar a modo claro
  font:
    text: Inter
  logo: assets/brand/inventy-logo.svg
  favicon: assets/brand/favicon.svg
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - navigation.tracking
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - toc.follow

extra_css:
  - assets/stylesheets/ayuda.css

plugins:
  - search:
      lang: es
  - tags
  - glightbox:
      touchNavigation: true
      zoomable: true
      skip_classes:
        - sin-zoom

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - def_list
  - tables
  - toc:
      permalink: "#"
      title: En esta guía
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.keys
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra:
  # Estados de revisión permitidos en el campo `estado` de cada artículo.
  estados:
    borrador: Borrador
    pendiente-validacion: Pendiente de validación
    validado: Validado funcionalmente
    publicado: Publicado
    requiere-actualizacion: Requiere actualización

